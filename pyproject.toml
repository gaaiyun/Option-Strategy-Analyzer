[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "option-strategy-analyzer"
version = "0.3.0"
description = "Deterministic option pricing, strategy payoff and scenario analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "gaaiyun"}]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
]

[project.optional-dependencies]
dashboard = ["plotly>=5.15.0", "streamlit>=1.28.0"]
market = ["yfinance>=0.2.28"]
llm = ["openai>=1.0.0", "anthropic>=0.25.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0", "build>=1.2.0"]
full = [
  "plotly>=5.15.0",
  "streamlit>=1.28.0",
  "yfinance>=0.2.28",
  "openai>=1.0.0",
  "anthropic>=0.25.0",
]

[project.scripts]
option-analyzer = "option_analyzer_cli:main"

[tool.setuptools]
packages = []
py-modules = [
  "option_analyzer_cli",
  "option_pricer",
  "greeks_calculator",
  "strategy_builder",
  "strategy_advisor",
  "strategy_scenario",
  "data_fetch",
  "volatility_analyzer",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
markers = [
  "slow: marks slow tests",
  "network: marks tests requiring network access",
]
